<!-- src/templates/login.html -->
{% extends "base.html" %}

{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div class="card shadow-sm form-card">
    <div class="card-header bg-white">
        <h4 class="mb-0">Iniciar sesión</h4>
    </div>
    <div class="card-body">
        {% if registrado %}
        <div class="alert alert-success">Cuenta creada. Ya puedes iniciar sesión.</div>
        {% endif %}
        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="post" action="/views/login">
            <div class="mb-3">
                <label class="form-label" for="username">Usuario</label>
                <input class="form-control" id="username" name="username" required value="{{ username or '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label" for="password">Contraseña</label>
                <input class="form-control" id="password" name="password" type="password" required>
            </div>
            <button class="btn btn-primary" type="submit">Entrar</button>
            <a class="btn btn-link" href="/views/register">Crear cuenta</a>
        </form>
    </div>
</div>
{% endblock %}
